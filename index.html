<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#18243c"><title>L'hiver de notre amour</title>
<style>
:root{--bg:#101b2d;--panel:#1c2b45;--gold:#f3cf87;--pink:#f3a9c4;--ice:#c9e8ff;--text:#f7f5f2;--muted:#b8c5d6}*{box-sizing:border-box}body{margin:0;color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(ellipse at top,#314765 0,#18243b 48%,#0d1625 100%);min-height:100vh;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#ffffffaa 1px,transparent 1.5px),radial-gradient(#ffffff66 1px,transparent 1.5px);background-size:45px 45px,83px 83px;background-position:0 0,17px 21px;animation:snow 22s linear infinite;opacity:.5}@keyframes snow{to{background-position:0 500px,17px 600px}}.wrap{max-width:760px;margin:auto;padding:22px 15px 40px;position:relative}.hero{text-align:center;padding:20px 10px 18px}.eyebrow{letter-spacing:.18em;text-transform:uppercase;color:var(--ice);font-size:.75rem}.hero h1{font-family:Georgia,serif;font-weight:500;font-size:clamp(2rem,8vw,3.3rem);margin:.4rem 0;color:var(--gold);text-shadow:0 3px 20px #0006}.hero p{color:var(--muted);max-width:520px;margin:0 auto}.progress{height:8px;background:#ffffff20;border-radius:99px;overflow:hidden;margin:18px auto 7px;max-width:360px}.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--gold));transition:width .5s}.progress-label{font-size:.82rem;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0}.door{border:1px solid #ffffff20;background:linear-gradient(150deg,#293d5a,#18283f);border-radius:16px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 8px 18px #0002;cursor:pointer;transition:.2s;position:relative;overflow:hidden}.door:active{transform:scale(.96)}.door .num{font-size:1.6rem;color:var(--gold);font-weight:700}.door .gift{font-size:1.45rem;margin:3px}.door .state{font-size:.7rem;color:var(--muted)}.door.open{border-color:#e9c67d80;background:linear-gradient(150deg,#604c3c,#29394e)}.door.today{box-shadow:0 0 0 2px var(--gold),0 0 20px #f3cf8750;animation:pulse 2s infinite}.door.locked{opacity:.6;cursor:not-allowed}@keyframes pulse{50%{box-shadow:0 0 0 2px var(--gold),0 0 26px #f3cf8770}}.footer{text-align:center;color:var(--muted);font-size:.82rem;margin:20px 0}.modal{position:fixed;inset:0;background:#07101dcc;display:none;align-items:center;justify-content:center;padding:16px;z-index:5}.modal.show{display:flex}.box{width:min(100%,500px);max-height:90vh;overflow:auto;background:linear-gradient(160deg,#263a57,#17253b);border:1px solid #ffffff22;border-radius:22px;padding:22px;box-shadow:0 20px 60px #0007}.box h2{color:var(--gold);font-family:Georgia,serif;font-weight:500;margin:0 0 8px}.desc{color:var(--muted);margin:0 0 18px}.gamearea{min-height:200px;border-radius:15px;background:#101c2e;border:1px solid #ffffff14;padding:14px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;touch-action:manipulation}.btn{border:0;border-radius:12px;padding:12px 18px;background:var(--gold);color:#253247;font-weight:750;font-size:1rem;cursor:pointer}.btn.secondary{background:#ffffff18;color:var(--text);border:1px solid #ffffff25}.btn:disabled{opacity:.4}.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.message{min-height:24px;color:var(--ice)}.close{margin-top:14px;width:100%}.target{width:68px;height:68px;border-radius:50%;background:var(--pink);border:0;font-size:1.6rem;cursor:pointer;box-shadow:0 0 18px #f3a9c455}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;width:100%}.card{height:65px;border-radius:10px;border:1px solid #ffffff25;background:#304764;font-size:1.4rem;cursor:pointer}.card.revealed{background:#d7e8f6;color:#25364c}.sequence{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.sequence button{min-width:55px;height:55px;font-size:1.25rem}.tapzone{width:100%;height:175px;border-radius:12px;background:#213653;position:relative;overflow:hidden}.moving{position:absolute;border:0;border-radius:50%;width:45px;height:45px;background:var(--gold);font-size:1.25rem}.input{font-size:1.2rem;padding:10px;border-radius:10px;border:1px solid #ffffff30;background:#fff;color:#18243a;width:120px;text-align:center}.maze{display:grid;grid-template-columns:repeat(5,40px);gap:4px}.maze button{width:40px;height:40px;border:0;border-radius:7px;background:#2e4666;font-size:1.2rem}.maze button.wall{background:#0b1422}.small{font-size:.8rem;color:var(--muted)}@media(min-width:600px){.grid{grid-template-columns:repeat(6,1fr);gap:12px}.door .num{font-size:2rem}}@media(max-width:360px){.grid{gap:7px}.door{border-radius:12px}.door .num{font-size:1.3rem}}
</style></head>
<body><main class="wrap"><header class="hero"><div class="eyebrow">Un petit monde rien qu'à toi</div><h1>L'hiver de notre amour</h1><p>24 jours, 24 petits défis. Chaque cadeau se mérite… et une surprise t'attend après chaque victoire. ❤️</p><div class="progress"><div id="bar"></div></div><div class="progress-label" id="progressLabel">0 cadeau débloqué</div></header><div class="grid" id="calendar"></div><p class="footer">Un défi par jour · Joyeux Noël ❤️</p></main>
<div class="modal" id="modal"><div class="box"><h2 id="gameTitle">Défi du jour</h2><p class="desc" id="gameDesc"></p><div class="gamearea" id="gameArea"></div><button class="btn secondary close" id="closeBtn">Fermer</button></div></div>
<script>
const gifts=Array.from({length:24},(_,i)=>({day:i+1,opened:false}));const saved=JSON.parse(localStorage.getItem('winterLoveProgress')||'{}');gifts.forEach(g=>g.opened=!!saved[g.day]);let activeDay=0;const $=s=>document.querySelector(s);
function today(){return new Date().getDate()}function currentMonth(){return new Date().getMonth()}function allowedDay(){return currentMonth()===11?Math.min(24,today()):24}
function render(){let cal=$('#calendar');cal.innerHTML='';let opened=gifts.filter(x=>x.opened).length;$('#bar').style.width=(opened/24*100)+'%';$('#progressLabel').textContent=opened+' cadeau'+(opened>1?'s':'')+' débloqué'+(opened>1?'s':'');gifts.forEach(g=>{let d=document.createElement('button');d.className='door '+(g.opened?'open':'')+(g.day===allowedDay()&&!g.opened?' today':'')+(g.day>allowedDay()&&!g.opened?' locked':'');d.innerHTML=`<div class="num">${g.day}</div><div class="gift">${g.opened?'✨':'🎁'}</div><div class="state">${g.opened?'Débloqué':g.day>allowedDay()?'Verrouillé':'À jouer'}</div>`;d.disabled=!g.opened&&g.day>allowedDay();d.onclick=()=>openGame(g.day);cal.appendChild(d)})}
function markWon(){gifts[activeDay-1].opened=true;localStorage.setItem('winterLoveProgress',JSON.stringify(Object.fromEntries(gifts.map(g=>[g.day,g.opened]))));render();$('#gameArea').innerHTML='<div style="font-size:3rem">🎉🎁✨</div><strong>Défi réussi !</strong><p>Ta surprise du jour est maintenant débloquée.</p><p style="color:var(--gold)">Va retrouver la personne qui a préparé ce calendrier… ❤️</p>'}
function setGame(title,desc,html){$('#gameTitle').textContent=title;$('#gameDesc').textContent=desc;$('#gameArea').innerHTML=html}
function openGame(day){activeDay=day;$('#modal').classList.add('show');buildGame(day)}$('#closeBtn').onclick=()=>$('#modal').classList.remove('show');$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))$('#modal').classList.remove('show')});
// 24 challenges with distinct goals; several compact mechanics share reusable handlers.
function buildGame(day){let area=$('#gameArea');const win=markWon;switch(day){
case 1: setGame('Attrape 8 cadeaux','Tape sur les cadeaux qui apparaissent. Il en faut 8 !','<div class="tapzone" id="zone"></div><div id="score">0 / 8</div>');let sc=0;function spawn(){if(sc>=8)return win();let b=document.createElement('button');b.className='moving';b.textContent='🎁';b.style.left=Math.random()*75+'%';b.style.top=Math.random()*65+'%';b.onclick=()=>{sc++;$('#score').textContent=sc+' / 8';b.remove();spawn()};$('#zone').appendChild(b)}spawn();break;
case 2: memoryGame('Retrouve les 4 paires','Retourne les cartes et trouve toutes les paires.');break;
case 3: reactionGame();break;
case 4: numberGame('Trouve le nombre','Devine le nombre entre 1 et 20 en 5 essais.',1,20,5);break;
case 5: sequenceGame('La séquence magique','Répète la séquence de symboles dans le bon ordre.');break;
case 6: clickCountGame('Réflexes de lutin','Tape 12 fois sur le bouton avant la fin.',12);break;
case 7: codeGame('Le code du traîneau','Trouve le code à 3 chiffres. Chaque chiffre est entre 1 et 5.',3);break;
case 8: memoryGame('Mémoire de Noël','Retrouve les 5 paires cachées.',5);break;
case 9: numberGame('Le chiffre mystère','Trouve le nombre entre 1 et 50 en 7 essais.',1,50,7);break;
case 10: sequenceGame('Les étoiles dans l’ordre','Répète une séquence de 5 symboles.');break;
case 11: clickCountGame('Défi de rapidité','Fais 15 taps pour allumer les lumières.',15);break;
case 12: codeGame('Le coffre polaire','Trouve le code à 4 chiffres (1 à 6).',4);break;
case 13: slidingGame();break;
case 14: memoryGame('Les souvenirs enneigés','Trouve toutes les paires de symboles.',6);break;
case 15: catchGame();break;
case 16: mazeGame();break;
case 17: reactionGame();break;
case 18: numberGame('Le défi des flocons','Trouve le nombre entre 1 et 100 en 8 essais.',1,100,8);break;
case 19: sequenceGame('La ronde des lumières','Reproduis la séquence de 6 symboles.');break;
case 20: clickCountGame('Dernière ligne droite','Réalise 20 touches pour atteindre la ligne d’arrivée.',20);break;
case 21: codeGame('La serrure enchantée','Trouve le code à 5 chiffres (1 à 4).',5);break;
case 22: slidingGame(true);break;
case 23: mazeGame(true);break;
case 24: finalGame();break;
}}
function memoryGame(title,desc,pairs=4){let symbols=['🎄','❄️','⭐','🦌','🧦','🔔','🍪','🕯️'].slice(0,pairs);let deck=[...symbols,...symbols].sort(()=>Math.random()-.5),picked=[],matched=0;setGame(title,desc,`<div class="cards" id="cards"></div><div class="message" id="memmsg">${matched}/${pairs} paires</div>`);deck.forEach((sym,i)=>{let b=document.createElement('button');b.className='card';b.textContent='❔';b.onclick=()=>{if(b.classList.contains('revealed')||picked.length===2)return;b.classList.add('revealed');b.textContent=sym;picked.push({b,sym});if(picked.length===2){if(picked[0].sym===picked[1].sym){matched++;picked=[];$('#memmsg').textContent=matched+'/'+pairs+' paires';if(matched===pairs)setTimeout(markWon,500)}else setTimeout(()=>{picked.forEach(x=>{x.b.classList.remove('revealed');x.b.textContent='❔'});picked=[]},650)}};$('#cards').appendChild(b)})}
function reactionGame(){setGame('Réflexe de Noël','Attends que le bouton devienne doré, puis tape le plus vite possible.','<button class="btn" id="react">Démarrer</button><div class="message" id="reactmsg"></div>');let btn=$('#react'),ready=false,timer;btn.onclick=()=>{if(!ready){btn.disabled=true;$('#reactmsg').textContent='Patience…';timer=setTimeout(()=>{ready=true;btn.disabled=false;btn.textContent='TAPE !';btn.style.background='#8df0b3'},1000+Math.random()*2500)}else{clearTimeout(timer);markWon()}}}
function numberGame(title,desc,min,max,tries){let n=Math.floor(Math.random()*(max-min+1))+min,left=tries;setGame(title,desc,`<input class="input" id="guess" type="number" min="${min}" max="${max}" placeholder="${min} à ${max}"><button class="btn" id="guessbtn">Valider</button><div class="message" id="guessmsg">${left} essais</div>`);$('#guessbtn').onclick=()=>{let v=Number($('#guess').value);if(v<min||v>max)return;left--;if(v===n)markWon();else if(left<=0){$('#guessmsg').textContent='Raté ! Le nombre était '+n+'. Relance le défi.';n=Math.floor(Math.random()*(max-min+1))+min;left=tries}else $('#guessmsg').textContent=(v<n?'Plus grand !':'Plus petit !')+' · '+left+' essais restants'} }
function sequenceGame(title,desc){let seq=Array.from({length:5},()=>['⭐','🎄','❄️','🎁'][Math.floor(Math.random()*4)]),pos=0;setGame(title,desc,`<div id="seqshow" style="font-size:2rem">Prêt ?</div><div class="sequence" id="seqbuttons"></div><button class="btn" id="seqstart">Voir la séquence</button><div class="message" id="seqmsg"></div>`);let show=$('#seqshow'),buttons=$('#seqbuttons');['⭐','🎄','❄️','🎁'].forEach(sym=>{let b=document.createElement('button');b.className='btn secondary';b.textContent=sym;b.onclick=()=>{if(pos>=seq.length)return;if(sym===seq[pos]){pos++;$('#seqmsg').textContent=pos+'/'+seq.length;if(pos===seq.length)markWon()}else{pos=0;$('#seqmsg').textContent='Oups, recommence !'}};buttons.appendChild(b)});$('#seqstart').onclick=()=>{show.textContent=seq.join('  ');pos=0;$('#seqmsg').textContent='À toi de jouer !';setTimeout(()=>show.textContent='À toi !',1800)}}
function clickCountGame(title,desc,goal){let count=0;setGame(title,desc,`<button class="target" id="tap">✨</button><div id="tapcount">0 / ${goal}</div>`);$('#tap').onclick=()=>{count++;$('#tapcount').textContent=count+' / '+goal;if(count>=goal)markWon()}}
function codeGame(title,desc,length){let code=Array.from({length},()=>Math.floor(Math.random()*5)+1).join('');setGame(title,desc,`<input class="input" id="codein" inputmode="numeric" maxlength="${length}" placeholder="${'•'.repeat(length)}"><button class="btn" id="codebtn">Déverrouiller</button><div class="message" id="codemsg"></div>`);$('#codebtn').onclick=()=>{if($('#codein').value===code)markWon();else $('#codemsg').textContent='Code incorrect, essaie encore !'}}
function slidingGame(hard=false){let count=hard?6:4;let target=hard?12:8;let x=0;setGame('Glisse vers la sortie','Appuie sur les flèches pour faire avancer le petit flocon. Atteins '+target+' pas.',`<div class="row"><button class="btn secondary" id="left">⬅️</button><button class="btn secondary" id="right">➡️</button></div><div style="font-size:2rem" id="snowman">❄️</div><div id="slidecount">0 / ${target}</div>`);$('#left').onclick=()=>{x=Math.max(0,x-1);$('#slidecount').textContent=x+'/'+target};$('#right').onclick=()=>{x++;$('#slidecount').textContent=x+'/'+target;if(x>=target)markWon()}}
function catchGame(){let count=0;setGame('Attrape les étoiles','Tape sur 10 étoiles pour gagner !','<div class="tapzone" id="starzone"></div><div id="starcount">0 / 10</div>');function spawn(){if(count>=10)return markWon();let b=document.createElement('button');b.className='moving';b.textContent='⭐';b.style.left=Math.random()*75+'%';b.style.top=Math.random()*65+'%';b.onclick=()=>{count++;$('#starcount').textContent=count+'/10';b.remove();spawn()};$('#starzone').appendChild(b);setTimeout(()=>{if(b.isConnected){b.remove();spawn()}},1100)}spawn()}
function mazeGame(hard=false){let pos=0,goal=hard?12:8;setGame('Le chemin des cadeaux','Utilise les boutons pour avancer. '+goal+' pas pour atteindre le cadeau.',`<div style="font-size:2rem" id="mazechar">🧝</div><div class="row"><button class="btn secondary" id="mleft">⬅️</button><button class="btn secondary" id="mup">⬆️</button><button class="btn secondary" id="mdown">⬇️</button><button class="btn secondary" id="mright">➡️</button></div><div id="mazecount">0 / ${goal}</div>`);function move(delta){pos=Math.max(0,pos+delta);$('#mazecount').textContent=pos+'/'+goal;if(pos>=goal)markWon()}$('#mleft').onclick=()=>move(-1);$('#mright').onclick=()=>move(1);$('#mup').onclick=()=>move(2);$('#mdown').onclick=()=>move(1)}
function finalGame(){let step=0;setGame('Le grand final ❤️','Trois petites épreuves pour arriver jusqu’à Noël.',`<div id="finaltext">Épreuve 1 : tape 10 fois sur l’étoile.</div><button class="target" id="finaltap">⭐</button><div id="finalcount">0 / 10</div>`);let c=0;$('#finaltap').onclick=()=>{c++;$('#finalcount').textContent=c+'/10';if(c>=10){step++;if(step>=3)markWon();else{c=0;$('#finaltext').textContent='Épreuve '+(step+1)+' : '+(step===1?'retape 10 fois sur le cadeau.':'retape 10 fois sur le cœur.');$('#finaltap').textContent=step===1?'🎁':'❤️';$('#finalcount').textContent='0 / 10'}}}}
render();
</script></body></html>
